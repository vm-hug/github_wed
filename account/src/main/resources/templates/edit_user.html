<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
<div align="center">
    <h1>Edit User</h1>
    <h1 style="text-align: center;"><img th:src="${user.getPhotosImagePath()}" class="img-circle" alt="Cinque Terre" width="150" height="150"/></h1>
    <br/>
    <form action="#" th:action="@{/saveUser}" th:object="${user}"
          method="post" enctype="multipart/form-data">

        <table border="0" cellpadding="10">
            <tr>
                <td>User Id :</td>
                <td><input type="text" th:field="*{id}" readonly="readonly"></td>
            </tr>
            <tr>
                <td>User Name :</td>
                <td><input type="text" th:field="*{username}" placeholder="User name"></td>
            </tr>
            <tr>
                <td>Email :</td>
                <td><input type="text" th:field="*{email}" placeholder="email"></td>
            </tr>
            <tr>
                <td>Phone :</td>
                <td><input type="text" th:field="*{phone}" placeholder="phone"></td>
            </tr>
            <tr>
                <td>Address :</td>
                <td><input type="text" th:field="*{address}" placeholder="address"></td>
            </tr>
            <tr>
                <td>Photo:</td>
                <td><input type="file" name="image" accept="image/png , image/jpeg"></td>
            </tr>
            <tr>
                <td colspan="2"><button type="submit" class="btn btn-primary">Save User</button></td>
            </tr>
        </table>
    </form>
    <a th:href="@{/users}">Back to Users</a>
</div>
</body>
</html>
