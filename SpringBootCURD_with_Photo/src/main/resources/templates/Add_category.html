<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <meta name="description" content="POS - Bootstrap Admin Template">
    <meta name="keywords"
        content="admin, estimates, bootstrap, business, corporate, creative, management, minimal, modern,  html5, responsive">
    <meta name="author" content="Dreamguys - Bootstrap Admin Template">
    <meta name="robots" content="noindex, nofollow">
    <title>Dreams Pos admin template</title>

    <!-- <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.jpg"> -->

    <link rel="stylesheet" href="" th:href="@{/css/bootstrap.min.css}">

    <link rel="stylesheet" href="" th:href="@{/css/animate.css}">

    <link rel="stylesheet" href="" th:href="@{/css/dataTables.bootstrap4.min.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css">

    <!-- <link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css"> -->

    <link rel="stylesheet" href="" th:href="@{/css/style.css}">
</head>

<body>
    <div id="global-loader">
        <div class="whirly-loader"> </div>
    </div>

    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="page-wrapper">
        <div class="content">
            <div class="page-header">
                <div class="page-title">
                    <h4>Categories Add</h4>
                    <h6>Manage your Categories</h6>
                </div>
                <div class="page-btn">
                    <a href="showNewCategory" class="btn btn-added">
                        <img src="assets/img/icons/plus.svg" alt="img" class="me-1">
                        Add New Categories
                    </a>
                </div>
            </div>
    
            <!-- FORM THÊM CATEGORY -->
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/saveCategory}" method="post" th:object="${category}">
                        <div class="form-group">
                            <label for="name">Category Name</label>
                            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter category name" required>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Save</button>
                        <a th:href="@{/categories}" class="btn btn-secondary mt-3">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="" th:src="@{/js/jquery-3.6.0.min.js}"></script>

    <script src="" th:src="@{/js/feather.min.js}"></script>

    <script src="" th:src="@{/js/jquery.slimscroll.min.js}"></script>

    <script src="" th:src="@{/js/jquery.dataTables.min.js}"></script>
    <script src="" th:src="@{/js/dataTables.bootstrap4.min.js}"></script>

    <script src="" th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <script src="" th:src="@{/js/script.js}"></script>
</body>

</html>
